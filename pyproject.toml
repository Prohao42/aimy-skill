[project]
name = "aimy-skill"
dynamic = ["version"]
description = "轻量级渗透测试辅助工具链 (AI Agent Ready)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "yangdada863" },
]
keywords = ["security", "pentest", "ai-agent", "claude", "penetration-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "PyJWT>=2.6.0",
    "cryptography>=39.0.0,<49",
    "PyYAML>=6.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-asyncio>=0.21.0",
    "requests-mock>=1.10.0",
    "responses>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "types-requests>=2.28.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Prohao42/aimy-skill"
Repository = "https://github.com/Prohao42/aimy-skill"
BugTracker = "https://github.com/Prohao42/aimy-skill/issues"

[project.scripts]
aimy = "main:main"
aimy-mcp = "aimy_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=tools/ --cov-report=term-missing --cov-fail-under=80"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "online: marks tests that require network access",
]

[tool.ruff]
line-length = 100
target-version = "py39"
# 第三方技能库与文档中的示例代码不参与项目格式化，避免无意义的大 diff。
extend-exclude = ["ai-mian", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501", "N812", "E402", "E741", "E701", "E721"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# The toolchain is heavily dynamic (dict[str, object] inference). These codes are
# overwhelmingly inference noise from untyped dict values; disable them so the
# meaningful checks below surface real bugs (wrong arg counts, bad format strings,
# bad overrides, missing imports).
disable_error_code = [
    "attr-defined",
    "union-attr",
    "assignment",
    "var-annotated",
    "index",
    "operator",
    "list-item",
    "dict-item",
    "misc",
    "valid-type",
    "has-type",
    "no-any-return",
    "return-value",
    "call-overload",
    "import-untyped",
]

[tool.ruff.lint.per-file-ignores]
"tools/jwt_attacker.py" = ["F401"]
"tools/chain_engine.py" = ["F507", "F509"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["tools"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B311", "B403", "B405"]

[tool.setuptools.dynamic]
version = { attr = "tools.version.__version__" }

[tool.setuptools.packages.find]
# cli/ 承载命令行解析与命令注册 (main.py 直接 import cli.*),必须随包安装
# payload_seeds/ 与 data/ 是运行时资源包,必须随 wheel 安装
include = [
    "tools*", "tools.*",
    "engine*", "engine.*",
    "cli*", "cli.*",
    "payload_seeds*",
    "data*",
    "wordlists*",
]

[tool.setuptools]
# 顶层模块 main.py 承载 CLI 入口 (aimy = "main:main"),必须随包安装
py-modules = ["main"]

[tool.setuptools.package-data]
payload_seeds = ["*.yml"]
data = ["*.json"]
wordlists = ["*.txt", "*.rule", "*.conf"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
