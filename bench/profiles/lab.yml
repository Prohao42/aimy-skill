# 内置 mock 靶场 (lab_server.py) ground-truth —— 用于 harness 自身冒烟验证
# 起靶场: python lab_server.py  (监听 127.0.0.1:18774)

profile: lab
requires_login: false
base_url: http://127.0.0.1:18774

cases:
  - {name: sqli_error,  vuln_class: sqli,  level: any, path: /sqli_error,  param: id,   expected: true}
  - {name: sqli_bool,   vuln_class: sqli,  level: any, path: /sqli_bool,   param: id,   expected: true}
  - {name: sqli_union,  vuln_class: sqli,  level: any, path: /sqli_union,  param: id,   expected: true}
  - {name: sqli_post,   vuln_class: sqli,  level: any, path: /sqli_post,   param: id,   expected: true, method: POST, note: form POST 契约}
  - {name: xss_reflect, vuln_class: xss,   level: any, path: /xss_reflect, param: q,    expected: true}
  - {name: xss_attr,    vuln_class: xss,   level: any, path: /xss_attr,    param: q,    expected: true, note: 属性上下文}
  - {name: xss_js,      vuln_class: xss,   level: any, path: /xss_js,      param: q,    expected: true, note: script 字符串上下文}
  - {name: xss_post,    vuln_class: xss,   level: any, path: /xss_post,    param: q,    expected: true, method: POST, note: form POST 契约}
  - {name: cmdi,        vuln_class: cmdi,  level: any, path: /cmdi,        param: cmd,  expected: true}
  - {name: ssti,        vuln_class: ssti,  level: any, path: /ssti,        param: name, expected: true}
  - {name: ssti_alt,    vuln_class: ssti,  level: any, path: /ssti_alt,    param: name, expected: true, note: "备用引擎 ${7*7}"}
  - {name: lfi,         vuln_class: lfi,   level: any, path: /lfi,         param: file, expected: true}
  - {name: lfi_hardened, vuln_class: lfi,  level: any, path: /lfi_hardened, param: file, expected: true, note: 仅 ....// 或 %2f 可绕过}
  - {name: nosql,       vuln_class: nosqli, level: any, path: /nosql,      param: id,   expected: true}
  - {name: nosqli_get,  vuln_class: nosqli, level: any, path: /nosqli_get, param: id,   expected: true, note: GET 操作符注入}
  - {name: ssrf_metadata, vuln_class: ssrf, level: any, path: /ssrf,       param: url,  expected: true, note: 服务端抓取返回云元数据}
  - {name: jwt_weak,    vuln_class: jwt,   level: any, path: /jwt_weak,   param: token, expected: true, note: 页面 JWT 使用弱密钥}
  - {name: deser_php,   vuln_class: deser, level: any, path: /deser,      param: data, expected: true, method: POST, note: PHP unserialize 错误}
  - {name: clean_sqli,  vuln_class: sqli,  level: any, path: /clean_sqli,  param: q,    expected: false, note: 参数化查询, 必须 TN}
  - {name: clean_xss,   vuln_class: xss,   level: any, path: /clean_xss,   param: q,    expected: false, note: HTML 转义回显, 必须 TN}
  - {name: clean_attr,  vuln_class: xss,   level: any, path: /clean_attr,  param: q,    expected: false, note: 属性上下文已转义, 必须 TN}
  - {name: clean_ssti,  vuln_class: ssti,  level: any, path: /clean_ssti,  param: name, expected: false, note: 字面量回显不求值, 必须 TN}
  - {name: clean_ssrf,  vuln_class: ssrf,  level: any, path: /clean_ssrf,  param: url,  expected: false, timeout: 1, note: 抓取失败, 必须 TN}
  - {name: jwt_clean,   vuln_class: jwt,   level: any, path: /jwt_clean,  param: token, expected: false, note: 强密钥 JWT, 必须 TN}
  - {name: clean_deser, vuln_class: deser, level: any, path: /clean_deser, param: data, expected: false, method: POST, note: 正常反序列化响应, 必须 TN}
